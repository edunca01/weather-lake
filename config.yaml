# weather-lake configuration: the single source of what is collected and how.
# Terraform reads each product's schedule from here; the pipeline reads everything else.

openmeteo:
  forecast_url: https://api.open-meteo.com/v1/forecast
  previous_runs_url: https://previous-runs-api.open-meteo.com/v1/forecast
  timeout_s: 30
  max_retries: 2
  # A scheduled poll gives up well before the next one; the next poll is the retry.
  request_budget_s: 120

lake:
  # Overridden by LAKE_ROOT. A local directory offline, s3://<bucket> when deployed.
  root: ./data

# Every product listed here is collected. A product is one Open-Meteo model: vintages are only
# comparable within a fixed model, so `best_match` (which switches models) is never used.
products:
  openmeteo-gfs-seamless:
    name: Open-Meteo GFS seamless (HRRR + GFS), hourly
    model: gfs_seamless
    forecast_days: 8                 # covers ERCOT's seven-day load forecast in Central time
    schedule: "cron(25 * * * ? *)"   # hourly, off the top of the hour as Open-Meteo asks
    stale_after_min: 240             # no new forecast content for 4 h is stale (HRRR runs hourly)
    # Declared variables and their units are exhaustive: a response that differs fails loudly.
    variables:
      temperature_2m: "°C"
      relative_humidity_2m: "%"
      dew_point_2m: "°C"
      apparent_temperature: "°C"
      wind_speed_10m: "m/s"
      wind_speed_100m: "m/s"
      shortwave_radiation: "W/m²"
      cloud_cover: "%"
      precipitation: "mm"
    # Vintages before live polling began, from the Previous Runs API. `_previous_dayN` is the
    # value predicted N x 24 h before the valid time; the lag makes posted_at err late.
    backfill:
      lead_days: [1, 2, 3, 4, 5, 6, 7]
      publication_lag_min: 60
      window_days: 14          # Open-Meteo counts each 14 days of one location as a call
      earliest: 2024-01-01     # most variables are archived from January 2024

# ERCOT's eight weather zones, named exactly as the ERCOT lake's load series name them, each
# the equal-weight mean of a few representative cities. Changing a point changes what a zone
# value means: a contract change with a CHANGELOG note.
zones:
  Coast:
    - {name: Houston, lat: 29.7604, lon: -95.3698}
    - {name: Galveston, lat: 29.3013, lon: -94.7977}
    - {name: Victoria, lat: 28.8053, lon: -97.0036}
  East:
