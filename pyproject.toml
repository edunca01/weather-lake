[project]
name = "weather-lake-pipeline"
version = "0.1.0"
description = "Point-in-time weather forecast lake for the ERCOT region: Open-Meteo -> immutable raw -> Parquet on S3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "weather-lake",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pyarrow>=17.0",
  "boto3>=1.35",
]

[project.scripts]
ingest = "ingest.cli:main_ingest"

[tool.uv.workspace]
members = ["lake"]

[tool.uv.sources]
weather-lake = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "pyarrow-stubs",
  "boto3-stubs[cloudwatch]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "lake/src"]
extend-exclude = [".dev", "samples", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["ingest", "lake/src"]
mypy_path = "lake/src"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "lake/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["ingest", "weather_lake"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
