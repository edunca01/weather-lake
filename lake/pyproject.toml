[project]
name = "weather-lake"
version = "0.1.0"
description = "Read the weather-lake point-in-time: the lake contract, schema and its point-in-time reader"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Keep this list short: consumers install it next to their own stacks.
dependencies = [
  "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_lake"]
