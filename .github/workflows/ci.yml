# Needs no secrets and no cloud account: lint, types, tests, Terraform against a mocked
# provider, gitleaks. Nothing here deploys; a deployment is its own Terraform root.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["weather-lake-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --all-groups --frozen
      - name: Config loads
        run: >-
          uv run python -c "from ingest.config import load_settings;
          s = load_settings(); print(len(s.products), 'products,', len(s.points()), 'points')"
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Format
        run: make tf-fmt
      - name: Validate and test (mocked AWS provider)
        run: make tf-test

  # A release is installed the way a consumer installs it: from the tag, the library only.
  release-install:
    if: startsWith(github.ref, 'refs/tags/weather-lake-v')
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
      - name: Install weather-lake from the tag
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          uv venv /tmp/consumer
          uv pip install --python /tmp/consumer \
            "weather-lake @ git+https://github.com/$REPO@$TAG#subdirectory=lake"
          /tmp/consumer/bin/python - <<'PY'
          import importlib.metadata as md
          import os
          import weather_lake
          tag = os.environ["TAG"].removeprefix("weather-lake-v")
          package = md.version("weather-lake")
          contract = weather_lake.CONTRACT_VERSION
          print(f"tag {tag}, package {package}, contract {contract}")
          assert tag == package == contract, "tag, package and contract versions differ"
          PY

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
